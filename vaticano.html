<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vaticano - Controle</title>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .caixa {
            background: white;
            width: 90%;
            max-width: 450px;
            padding: 25px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h1 {
            margin-bottom: 20px;
        }

        #leitor {
            width: 100%;
        }

        #resultado {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            word-break: break-word;
        }
    </style>
</head>

<body>

    <div class="caixa">

        <h1>🔐 Vaticano</h1>

        <div id="leitor"></div>

        <div id="resultado">
            📷 Aponte a câmera para o QR Code
        </div>

    </div>

    <script>

        function qrCodeLido(texto) {

            document.getElementById("resultado").innerHTML =
                "✅ QR CODE LIDO<br><br>" +
                texto;

        }

        function erroLeitura(error) {
            // Ignora erros enquanto procura o QR Code
        }

        const scanner = new Html5QrcodeScanner(
            "leitor",
            {
                fps: 10,
                qrbox: {
                    width: 250,
                    height: 250
                }
            },
            false
        );

        scanner.render(qrCodeLido, erroLeitura);

    </script>

</body>

</html>
